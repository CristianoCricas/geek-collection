name: Version

# Bumps the app version automatically on every push to the default branch:
#   feat/feature/melhoria/recurso commits → minor (new feature or improvement)
#   anything else (fix, chore, docs, refactor…) → patch
#   major is bumped by hand: run this workflow manually with bump = major.
# The bump commit is tagged vX.Y.Z and the build/deploy workflows are dispatched.

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type (major is manual only)"
        type: choice
        options: [auto, major, minor, patch]
        default: auto

permissions:
  contents: write
  actions: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide bump type
        id: decide
        env:
          REQUESTED: ${{ github.event.inputs.bump || 'auto' }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          subjects=""
          case "$HEAD_MESSAGE" in
            "chore(release)"*)
              # A release commit (manual version set or our own bump): only make sure its tag exists.
              echo "Release commit; ensuring the tag for the current version exists."
              echo "kind=ensure-tag" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if [ -z "$last_tag" ] && [ "$REQUESTED" = "auto" ]; then
            # First run: the VERSION file is the current release; just tag it.
            echo "No release tag yet; tagging the current version without bumping."
            echo "kind=ensure-tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REQUESTED" != "auto" ]; then
            kind="$REQUESTED"
          else
            if [ -n "$last_tag" ]; then range="$last_tag..HEAD"; else range="HEAD"; fi
            subjects="$(git log --format=%s "$range" | grep -v '^chore(release)' || true)"
            if [ -z "$subjects" ]; then
              echo "No commits since ${last_tag:-the beginning}; nothing to bump."
              echo "kind=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$subjects" | grep -Eiq '^(feat|feature|melhoria|recurso)(\(.*\))?!?:|\[minor\]'; then
              kind=minor
            elif echo "$subjects" | grep -Eivq '^docs(\(.*\))?:'; then
              kind=patch
            else
              echo "Only documentation commits since $last_tag; nothing to bump."
              kind=none
            fi
          fi
          echo "Commits considered:"; echo "${subjects:-<manual>}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Ensure the current version is tagged
        if: steps.decide.outputs.kind == 'ensure-tag'
        run: |
          set -euo pipefail
          v="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null 2>&1; then
            echo "$v already exists."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "Geek Collection ${v#v}"
          git push origin "refs/tags/$v"

      - name: Bump files
        if: steps.decide.outputs.kind != 'none' && steps.decide.outputs.kind != 'ensure-tag'
        id: bump
        run: |
          set -euo pipefail
          next="$(node scripts/bump-version.mjs "${{ steps.decide.outputs.kind }}")"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Commit, tag and push
        if: steps.decide.outputs.kind != 'none' && steps.decide.outputs.kind != 'ensure-tag'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION web/js/version.js web/sw.js web/package.json
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.next }} (${{ steps.decide.outputs.kind }})"
          # A stale tag with this name may exist if the version was set back by hand; move it.
          git tag -f -a "v${{ steps.bump.outputs.next }}" -m "Geek Collection ${{ steps.bump.outputs.next }}"
          git push origin HEAD:${{ github.ref_name }}
          git push --force origin "refs/tags/v${{ steps.bump.outputs.next }}"

      - name: Build and deploy the new version
        if: steps.decide.outputs.kind != 'none' && steps.decide.outputs.kind != 'ensure-tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android.yml --ref "${{ github.ref_name }}"
          gh workflow run pages.yml --ref "${{ github.ref_name }}"
